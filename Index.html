<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Tokyo+Zoo&family=M+PLUS+Rounded+1c:wght@300;400;700;900&family=Josefin+Sans:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6b8a;
    --rose: #e8194b;
    --light-pink: #ffb3c6;
    --dark: #0d0005;
    --card-bg: rgba(15, 0, 6, 0.75);
    --border: rgba(255, 107, 138, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: var(--dark);
    color: #fff0f3;
    overflow-x: hidden;
    cursor: crosshair;
  }

  /* ══ VERTICAL BG ══ */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    display: flex;
    align-items: stretch;
  }

  .bg-img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    filter: saturate(1.4) brightness(0.5);
    /* Vertical fade — dark top, visible middle, dark bottom */
    -webkit-mask-image: linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.6) 8%,
      rgba(0,0,0,1) 20%,
      rgba(0,0,0,1) 80%,
      rgba(0,0,0,0.6) 92%,
      rgba(0,0,0,0) 100%
    );
    mask-image: linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.6) 8%,
      rgba(0,0,0,1) 20%,
      rgba(0,0,0,1) 80%,
      rgba(0,0,0,0.6) 92%,
      rgba(0,0,0,0) 100%
    );
    /* On mobile: tighter fade since image is taller relative to viewport */
    transition: filter 0.3s;
  }

  @media (max-width: 600px) {
    .bg-img {
      object-position: 30% top;
      filter: saturate(1.4) brightness(0.45);
      -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.8) 5%,
        rgba(0,0,0,1) 15%,
        rgba(0,0,0,1) 85%,
        rgba(0,0,0,0.8) 95%,
        rgba(0,0,0,0) 100%
      );
      mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.8) 5%,
        rgba(0,0,0,1) 15%,
        rgba(0,0,0,1) 85%,
        rgba(0,0,0,0.8) 95%,
        rgba(0,0,0,0) 100%
      );
    }
  }

  .bg-tint {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 100% 50% at 50% 0%, rgba(232,25,75,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(232,25,75,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(255,45,107,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
  }

  /* ══ LAYOUT ══ */
  .container {
    position: relative; z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 56px 20px 100px;
  }

  /* ══ LOADER ══ */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    background: #0d0005;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    transition: opacity 0.7s ease 0.3s;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .loader-text { font-family: 'Josefin Sans', sans-serif; font-size: 11px; letter-spacing: 5px; color: var(--pink); text-transform: uppercase; animation: blink 1s infinite; }
  .loader-bar { width: 180px; height: 2px; background: rgba(255,107,138,0.15); border-radius: 2px; overflow: hidden; }
  .loader-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--light-pink)); animation: fill 1.3s ease forwards; }
  @keyframes fill { to { width: 100%; } }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ══ HEADER ══ */
  .header {
    display: flex; align-items: center; gap: 22px;
    margin-bottom: 36px;
    opacity: 0;
    animation: slideDown 0.8s cubic-bezier(0.22,1,0.36,1) 1.5s forwards;
  }
  @keyframes slideDown { from{opacity:0;transform:translateY(-28px)} to{opacity:1;transform:none} }

  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar {
    width: 90px; height: 90px; border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--pink);
    box-shadow: 0 0 0 5px rgba(255,107,138,0.10), 0 0 28px rgba(232,25,75,0.45);
    transition: box-shadow 0.3s, transform 0.3s;
  }
  .avatar:hover { box-shadow: 0 0 0 5px rgba(255,107,138,0.22), 0 0 50px rgba(232,25,75,0.7); transform: scale(1.04); }

  .status-ring {
    position: absolute; bottom: 4px; right: 4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #23a55a;
    border: 3px solid #0d0005;
    box-shadow: 0 0 8px rgba(35,165,90,0.8);
    animation: pulse-g 2s infinite;
  }
  @keyframes pulse-g { 0%,100%{box-shadow:0 0 8px rgba(35,165,90,0.7)} 50%{box-shadow:0 0 18px rgba(35,165,90,1)} }

  .header-text { flex:1; }
  .username {
    font-family: 'Zen Tokyo Zoo', cursive;
    font-size: clamp(24px, 5vw, 38px);
    color: #fff;
    text-shadow: 0 0 28px rgba(255,107,138,0.55);
    letter-spacing: 2px; line-height: 1;
  }
  .user-tag { font-family: 'Josefin Sans', sans-serif; font-size: 11px; letter-spacing: 3px; color: var(--pink); opacity: 0.65; margin-top: 4px; text-transform: uppercase; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge {
    padding: 3px 10px; border-radius: 20px;
    background: rgba(255,107,138,0.10);
    border: 1px solid rgba(255,107,138,0.22);
    font-size: 10px; letter-spacing: 1px;
    color: var(--light-pink);
    font-family: 'Josefin Sans', sans-serif;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }

  /* ══ DIVIDER ══ */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose), var(--pink), transparent);
    opacity: 0.35;
    margin: 26px 0;
  }

  /* ══ SECTION LABEL ══ */
  .sec-label {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 10px; letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--rose); opacity: 0.85;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .sec-label::after { content:''; flex:1; height:1px; background: linear-gradient(90deg,rgba(232,25,75,0.4),transparent); }

  /* ══ CARDS ══ */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.25s;
    opacity: 0;
    animation: fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) both;
  }
  .card:hover {
    border-color: rgba(255,107,138,0.5);
    box-shadow: 0 6px 36px rgba(232,25,75,0.18);
    transform: translateY(-2px);
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }

  /* ══ PRESENCE ══ */
  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 12px;
    background: rgba(35,165,90,0.13);
    border: 1px solid rgba(35,165,90,0.28);
    font-family: 'Josefin Sans', sans-serif;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: #57f287; margin-bottom: 10px;
  }
  .s-dot { width:6px; height:6px; border-radius:50%; background:#23a55a; animation:pulse-g 2s infinite; }

  .activity-inner { display:flex; align-items:center; gap:14px; }
  .act-img-wrap { position:relative; flex-shrink:0; }
  .act-img {
    width:56px; height:56px; border-radius:8px;
    object-fit:cover; border:1px solid var(--border);
    background:rgba(255,107,138,0.08);
  }
  .act-img-small {
    position:absolute; bottom:-5px; right:-5px;
    width:22px; height:22px; border-radius:4px;
    border:2px solid #0d0005; object-fit:cover;
  }
  .act-info { flex:1; min-width:0; }
  .act-name { font-size:14px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .act-detail { font-size:12px; color:var(--light-pink); opacity:0.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .act-time { font-size:11px; color:rgba(255,240,243,0.4); margin-top:2px; }
  .no-activity { font-size:13px; color:rgba(255,240,243,0.35); font-style:italic; text-align:center; padding:8px 0; }

  /* ══ SPOTIFY ══ */
  .sp-bar { display:flex; align-items:center; gap:14px; margin-top:6px; }
  .sp-thumb {
    width:50px; height:50px; border-radius:6px;
    object-fit:cover; flex-shrink:0;
    border:1px solid var(--border);
    background:rgba(255,107,138,0.08);
    animation: spin 8s linear infinite paused;
  }
  .sp-thumb.playing { animation-play-state:running; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .sp-info { flex:1; min-width:0; }
  .sp-title { font-size:14px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sp-artist { font-size:12px; color:var(--light-pink); opacity:0.7; }
  .sp-prog { margin-top:10px; height:3px; border-radius:3px; background:rgba(255,107,138,0.12); overflow:hidden; }
  .sp-prog-fill { height:100%; background:linear-gradient(90deg,var(--rose),var(--light-pink)); border-radius:3px; transition:width 1s linear; }
  .no-spotify { font-size:13px; color:rgba(255,240,243,0.3); font-style:italic; }

  /* ══ ABOUT ══ */
  .about-text { font-size:14px; line-height:1.85; color:rgba(255,240,243,0.82); font-weight:300; }
  .quote {
    margin-top:14px;
    border-left: 3px solid var(--rose);
    padding: 7px 14px;
    background: rgba(232,25,75,0.06);
    border-radius: 0 8px 8px 0;
    font-style: italic;
    color: var(--light-pink); font-size:13px; line-height:1.7;
  }

  /* ══ INFO GRID ══ */
  .info-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:12px; }
  .info-title {
    font-family:'Josefin Sans',sans-serif; font-size:10px;
    letter-spacing:3px; text-transform:uppercase;
    color:var(--rose); margin-bottom:7px;
    display:flex; align-items:center; gap:5px;
  }
  .info-body { font-size:13px; color:rgba(255,240,243,0.78); line-height:1.75; font-weight:300; }

  /* ══ BOT CARD ══ */
  .bot-card {
    overflow:hidden; padding:0;
    cursor:pointer; text-decoration:none; display:block;
    border-radius:14px;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.25s;
    opacity:0;
    animation: fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) both;
  }
  .bot-card:hover {
    border-color: rgba(255,107,138,0.55);
    box-shadow: 0 8px 40px rgba(232,25,75,0.25);
    transform: translateY(-3px);
  }
  .bot-banner {
    width:100%; height:120px;
    object-fit:cover; object-position:center;
    display:block;
    filter: brightness(0.85) saturate(1.2);
  }
  .bot-body {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    padding:16px 18px;
    display:flex; align-items:center; gap:14px;
  }
  .bot-pfp {
    width:52px; height:52px; border-radius:50%;
    object-fit:cover;
    border:2px solid var(--pink);
    box-shadow:0 0 12px rgba(232,25,75,0.4);
    flex-shrink:0;
    margin-top:-36px;
    position:relative; z-index:1;
  }
  .bot-info { flex:1; }
  .bot-name { font-size:15px; font-weight:700; color:#fff; }
  .bot-desc { font-size:12px; color:var(--light-pink); opacity:0.7; margin-top:2px; }
  .bot-invite {
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:8px;
    background: rgba(255,107,138,0.15);
    border:1px solid rgba(255,107,138,0.3);
    color:var(--light-pink); font-size:12px;
    font-family:'Josefin Sans',sans-serif;
    letter-spacing:1.5px; text-transform:uppercase;
    text-decoration:none;
    transition:background 0.2s, color 0.2s;
    flex-shrink:0;
  }
  .bot-invite:hover { background:rgba(255,107,138,0.28); color:#fff; }
  .bot-tag {
    display:inline-flex; align-items:center; gap:4px;
    font-family:'Josefin Sans',sans-serif; font-size:9px;
    letter-spacing:2px; text-transform:uppercase;
    background:rgba(87,242,135,0.12);
    border:1px solid rgba(87,242,135,0.25);
    color:#57f287; padding:2px 7px; border-radius:10px;
    margin-top:4px; display:inline-block;
  }

  /* ══ LIKE BUTTON ══ */
  .like-wrap {
    display:flex; justify-content:center;
    margin-top:28px;
    opacity:0;
    animation: fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) 2.5s both;
  }
  .like-btn {
    display:flex; align-items:center; gap:10px;
    padding:12px 28px; border-radius:40px;
    background: rgba(255,107,138,0.10);
    border:2px solid rgba(255,107,138,0.28);
    color:var(--light-pink);
    font-family:'Josefin Sans',sans-serif;
    font-size:13px; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer;
    transition:all 0.25s;
    position:relative; overflow:hidden;
    user-select:none;
  }
  .like-btn:hover:not(.voted) {
    background:rgba(255,107,138,0.20);
    border-color:rgba(255,107,138,0.5);
    color:#fff;
    transform:scale(1.03);
    box-shadow:0 0 20px rgba(232,25,75,0.3);
  }
  .like-btn.voted {
    background:rgba(232,25,75,0.22);
    border-color:var(--rose);
    color:#fff;
    cursor:default;
  }
  .like-btn.voted .heart { animation:heartPop 0.4s cubic-bezier(0.36,0.07,0.19,0.97) both; }
  @keyframes heartPop {
    0%{transform:scale(1)} 40%{transform:scale(1.5)} 70%{transform:scale(0.85)} 100%{transform:scale(1)}
  }
  .heart { font-size:18px; transition:transform 0.2s; }
  .like-count { font-size:14px; font-weight:700; }
  .like-label { font-size:10px; opacity:0.7; }

  .like-ripple {
    position:absolute; border-radius:50%;
    background:rgba(232,25,75,0.3);
    transform:scale(0); animation:ripple 0.6s ease-out;
    pointer-events:none;
  }
  @keyframes ripple { to{transform:scale(4);opacity:0} }

  /* ══ HEARTS FLOAT ══ */
  .hearts-bg { position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden; }
  .heart-p { position:absolute; animation:floatH linear forwards; opacity:0.6; pointer-events:none; }
  @keyframes floatH {
    0%{transform:translateY(100vh) scale(0);opacity:0.6}
    80%{opacity:0.4}
    100%{transform:translateY(-40px) scale(1.1);opacity:0}
  }

  /* ══ CORNER ══ */
  .corner {
    position:fixed; top:18px; right:16px;
    font-family:'Josefin Sans',sans-serif;
    font-size:9px; letter-spacing:3px;
    color:rgba(255,107,138,0.25); text-transform:uppercase;
    writing-mode:vertical-rl; pointer-events:none; z-index:3;
  }

  /* ══ STAGGER DELAYS ══ */
  .d1 { animation-delay:1.6s }
  .d2 { animation-delay:1.75s }
  .d3 { animation-delay:1.9s }
  .d4 { animation-delay:2.05s }
  .d5 { animation-delay:2.2s }
  .d6 { animation-delay:2.35s }

  @media(max-width:500px){
    .header{flex-direction:column;text-align:center}
    .badges{justify-content:center}
    .bot-body{flex-wrap:wrap}
    .bot-invite{width:100%;justify-content:center}
  }
</style>
</head>
